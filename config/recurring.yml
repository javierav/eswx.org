# Programación de Solid Queue.
#
# AEMET no ofrece push: hay que consultar su canal Atom. Cada tres minutos es
# suficiente, porque solo reelabora los avisos cuando cambia el estado, y el propio
# job se ahorra la descarga del tar.gz si el canal no se ha movido.
shared: &shared
  refresh_weather_alerts:
    class: RefreshWeatherAlertsJob
    queue: default
    schedule: every 3 minutes

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
